version: 1

setup_command: ""

paths:
  "appliance_cli.py":
    domains:
      - "core"
  "setup.py":
    domains:
      - "core"
  "tests/**":
    domains:
      - "core"

scenarios:
  - id: ADOPTED-TEST-001
    cost: medium
    estimated_seconds: 2
    timeout_seconds: 60
    agent_default: true
    scope: integration
    name: Complete native appliance CLI regression suite
    level: integration
    domains:
      - "core"
    triggers:
      - affected
    platforms:
      - "linux"
    command: "python3 -m unittest discover -s tests -v"
    invariants:
      - "management-network and NTPsec regressions remain green"
    release_gate: true

  - id: ADOPTED-STATIC-001
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: Git whitespace validation
    level: static
    domains:
      - "core"
    triggers:
      - pr
      - preflight
      - release
    platforms:
      - "linux"
    command: "bash -lc 'if [ -n \"${ENGINEERING_BASE_REF:-}\" ]; then git diff --check \"${ENGINEERING_BASE_REF}...HEAD\"; elif git rev-parse --verify --quiet origin/main >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git diff --check; fi'"
    invariants:
      - "committed candidate/base diff has no whitespace errors"
    release_gate: true
